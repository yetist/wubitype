[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wubitype"
version = "0.1.0"
description = "GTK4 五笔打字通（支持五笔 98 / 86 版）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wubitype contributors" }]
dependencies = ["PyGObject>=3.42"]
keywords = ["wubi", "typing", "chinese", "gtk4", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.scripts]
wubitype = "wubitype.app:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wubitype = ["style.css"]

[tool.setuptools.data-files]
"share/wubitype" = [
  "data/wubi98.main.txt",
  "data/wubi98.large.txt",
  "data/wubi98-table.png",
  "data/wubi86.main.txt",
  "data/wubi86.large.txt",
  "data/wubi86-table.png",
]
