[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wubitype"
version = "0.1.0"
description = "GTK4 五笔打字通（支持五笔 98 / 86 版）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wubitype contributors" }]
dependencies = ["PyGObject>=3.42"]

[project.scripts]
wubitype = "wubitype.app:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["wubitype", "wubitype.ui"]

[tool.setuptools.package-data]
wubitype = ["style.css"]
