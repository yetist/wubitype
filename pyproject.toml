[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wubi98type"
version = "0.1.0"
description = "GTK4 五笔 98 版打字练习软件"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wubi98type contributors" }]
dependencies = ["PyGObject>=3.42"]

[project.scripts]
wubi98type = "wubi98type.app:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["wubi98type", "wubi98type.ui"]

[tool.setuptools.package-data]
wubi98type = ["style.css"]
