app-id: io.github.wubitype.WubiType
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: wubitype

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: wubitype
    buildsystem: meson
    config-opts:
      - --buildtype=release
      # 内置文章来自第三方，确认再分发授权后可改为 true。
      - -Dinstall_articles=false
    sources:
      - type: dir
        path: ../..
